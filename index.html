<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jamile Abreu | A Patroa dos Empregos</title>
  <meta name="description" content="Catálogo de soluções profissionais da Jamile Abreu, A Patroa dos Empregos.">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #172636;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    .site-frame-wrap {
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      background: #172636;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
      background: #172636;
    }

    @media (min-width: 1024px) {
      .site-frame-wrap {
        height: 100vh;
      }

      iframe {
        transform: scale(1.08);
        transform-origin: top left;
        width: calc(100vw / 1.08);
        height: calc(100vh / 1.08);
      }
    }

    @media (min-width: 1440px) {
      iframe {
        transform: scale(1.12);
        width: calc(100vw / 1.12);
        height: calc(100vh / 1.12);
      }
    }
  </style>
</head>
<body>
  <div class="site-frame-wrap">
    <iframe
      src="https://jamileabreurh.github.io/catalogo-patroa/"
      title="Catálogo A Patroa dos Empregos"
      loading="eager">
    </iframe>
  </div>
</body>
</html>
